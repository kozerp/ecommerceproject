<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Online | Jacob's Subs</title>
	<link href="jacobs_layout.css" rel="stylesheet">
</head>
<body>
    <header class="top-bar">
        <div class="logo-area">Jacob's Subs</div>
        <nav class="main-nav">
            <a href="jacobs_frontpage.html">Home</a>
            <a href="menu_options.html">Menu</a>
            <a href="about_us.html">About Us</a>
            <a href="order_online.html">Order Online</a>
        </nav>
    </header>

    <main>
        <div class="container order-page">
            <h2 class="page-title">Place Your Order</h2>
            <form action="#" method="POST" id="order-form">
            <fieldset>
                <legend>Customer Information</legend>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </fieldset>

            <fieldset>
                <legend>Order Details</legend>
                <label for="sub-choice">Choose a Sub:</label>
                <select id="sub-choice" name="sub-choice">
                    <option value="italian">The Classic Italian</option>
                    <option value="turkey">Turkey Bacon Ranch</option>
                    <option value="philly">Philly Cheese Steak</option>
                    <option value="garden">Garden Sub</option>
                </select>

                <label for="instructions">Special Instructions:</label>
                <textarea id="instructions" name="instructions" rows="4"></textarea>
            </fieldset>

            <input type="submit" value="Submit Order">
        </form>
    </main>
</body>
</html>
